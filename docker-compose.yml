# The two halves, and the one thing that connects them.
#
# `web` is nginx: it terminates TLS, serves the built client, and proxies /api to `server`.
# `server` is the API, and it is deliberately NOT published on a host port - the only way to
# reach it is through the proxy, which is the arrangement TRUST_PROXY_HOPS=1 assumes.

services:
    server:
        build:
            context: .
            dockerfile: server/Dockerfile
        restart: unless-stopped
        environment:
            # Where the BUYER'S BROWSER reaches the site. Zarinpal returns them here, so a
            # wrong value strands every payment at the bank. It is the public https origin,
            # never this container's address.
            PUBLIC_BASE_URL: https://guardian-service.example
            NODE_ENV: production
        volumes:
            # THE BUSINESS IS IN THIS VOLUME: unsold gift codes, the order ledger, and the
            # gateway credentials. Back it up. Mounting anything other than /app/data leaves
            # the real database in the container's writable layer, where the next deploy
            # destroys it.
            - guardian-data:/app/data
            - guardian-logs:/app/logs
        # No `ports`. The API is reachable from `web` over the compose network and from
        # nowhere else, which is what makes the hop count in front of it a known quantity.
        expose:
            - '3000'

    web:
        build:
            context: .
            dockerfile: application/Dockerfile
        restart: unless-stopped
        depends_on:
            - server
        ports:
            - '80:80'
            - '443:443'
        volumes:
            # Certificates and the ACME challenge root, managed outside this file.
            - ./deploy/letsencrypt:/etc/letsencrypt:ro
            - ./deploy/certbot:/var/www/certbot

volumes:
    guardian-data:
    guardian-logs:
