# The edge. This file owns TLS, CORS, the security headers that belong to a TLS terminator,
# and serving the built client - so the application does not, and does not try to.
#
# THE THREE THINGS THAT MUST BE RIGHT, because getting any of them wrong is silent:
#
#   1. `X-Forwarded-For` is OVERWRITTEN, not appended to. `$proxy_add_x_forwarded_for` - the
#      usual snippet - appends the client's own header to the chain, so a client that sends
#      one of its own controls the left of the list. The application counts hops from the
#      RIGHT (TRUST_PROXY_HOPS=1), and this line is what makes that count trustworthy. Every
#      per-IP limit and the console's sign-in lockout rest on the pair.
#
#   2. `try_files ... /index.html` is what makes /admin/orders work on a refresh. The client
#      is a single page; without the fallback every deep link is a 404 from nginx that the
#      router never sees.
#
#   3. `/api/` is proxied WITHOUT a rewrite. The application mounts its routes under /api and
#      the browser calls /api - one prefix, one meaning, no path arithmetic in between.
#
# There is deliberately NO CORS header on /api. The browser only ever talks to this origin:
# the page and the API arrive from the same host, which is what makes cross-origin
# configuration unnecessary rather than merely absent. If a second origin ever needs the API,
# add `add_header Access-Control-Allow-Origin` HERE, with a specific origin - never `*` on an
# API that authenticates with a cookie.

upstream guardian_api
{
    # `server` is the service name in docker-compose.yml; use a host:port here otherwise.
    server server:3000;
    keepalive 16;
}

# Everything on http exists only to send the visitor to https.
server
{
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot's challenge has to stay reachable over plain http, so it is answered rather
    # than redirected.
    location /.well-known/acme-challenge/
    {
        root /var/www/certbot;
    }

    location /
    {
        return 301 https://$host$request_uri;
    }
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name guardian-service.example;

    ssl_certificate     /etc/letsencrypt/live/guardian-service.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guardian-service.example/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS lives here because TLS lives here. It is a promise about this hostname that only
    # the thing terminating TLS can honestly make - the application behind this proxy sees
    # plain http and could not tell whether the promise was true.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The shop takes payments and shows gift codes; nothing on it needs a camera or a
    # location, and saying so costs one line.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # A gift code is bearer value and the console is somebody's phone numbers. Neither may
    # sit in a shared cache, and the API says so for itself below.
    location /api/
    {
        proxy_pass http://guardian_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE, never append - see note 1 at the top of this file.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A bank's verify call can be slow; a buyer waiting on one must not be cut off
        # mid-settlement by the proxy giving up before the gateway answers.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering off;
    }

    # Hashed filenames, so they can be cached hard and forever.
    location /assets/
    {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The single page. `index.html` itself is never cached: it is the file that names which
    # hashed bundle is current, and a cached copy pins a browser to a deploy that is gone.
    location /
    {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
